;                                        by CustomGroup
;==========================================================
; Import files
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini
;==========================================================

[bar/bar]
; Monitor is injected per-instance by launch.sh (MONITOR env); empty => primary.
monitor = ${env:MONITOR:}
width = 100%
height = 16pt
radius = 2
underline-size = 0
dpi = 80
background = ${user.zinc950}
foreground = ${user.cyan600}
line-size = 2
border-bottom-size = 1pt
border-bottom-color = ${user.cyan950}
module-margin = 1
padding-left=0pt
padding-right=4pt
separator = ""
separator-foreground = ${user.sky}


; Fonts
font-0 = "Arimo Nerd Font:size=10:weight=150;2"
font-1 = "FiraCode Nerd Font Mono:size=9:weight=bold"

modules-left = rofi ss i3 xwindow
modules-right = numkey xkeyboard ss uptime ss filesystem ss cpu ss temp ss memory ss eth ss wifi ss protonvpn ss pulseaudio ss time ss redshift

cursor-click = pointer
; cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

;==========================================================
; Secondary-monitor bar (right/DP-0). Inherits ALL of bar/bar's geometry,
; colors, fonts and tray config — only the module lists are overridden so the
; second screen stays light: workspaces + window title on the left, clock on
; the right. No duplicated cpu/temp/mem/net/vpn readouts across both monitors.
[bar/bar-secondary]
inherit = bar/bar
modules-left = rofi ss i3 xwindow
modules-right = temp ss timer ss time
